name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python3 -m pytest tests/ -q

      - name: Run analysis script smoke test
        run: python3 analysis/build_summary_tables.py

      - name: Install matplotlib and rerun analysis script (figure path)
        run: |
          pip install matplotlib
          python3 analysis/build_summary_tables.py

      - name: Validate experiment summary JSON structure
        run: python3 -m analysis.check_summary_json
