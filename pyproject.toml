[project]
name = "raca-collective"
version = "0.1.0"
description = "From Adaptive Reasoning to Collective Cognition: outcome-aware reasoning allocation, cognitive delegation, and emergent specialization in multi-robot systems (Paper 3 in the RACA research arc)."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "numpy>=2.5.1,<2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
plots = [
    "matplotlib>=3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
